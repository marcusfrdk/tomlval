[project]
name = "tomlval"
version = "2.0.0"
description = "A flexible, easy-to-use, and dependency-free Python library for validating TOML data against custom schemas."
authors = [
    { name = "Marcus Fredriksson", email = "marcus@marcusfredriksson.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
readme = "README.md"
keywords = ["toml", "validator", "validation"]
dependencies = []

[project.optional-dependencies]
build = ["build", "twine"]
dev = ["black", "pytest", "isort", "pylint", "pre-commit"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tomlval", "tomlval.*"]

[tool.black]
line-length = 80
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 80

[tool.pylint.master]
ignore = ["venv", "__pycache__", ".git", "tests"]
persistent = true

[tool.pylint.messages_control]
disable = [
    "broad-exception-caught",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-public-methods",
]

[tool.pylint.format]
max-line-length = 80

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --verbosity=1"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/marcusfrdk/tomlval"
Repository = "https://github.com/marcusfrdk/tomlval"
Issues = "https://github.com/marcusfrdk/tomlval/issues"
