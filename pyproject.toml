[project]
name = "tomlval"
version = "1.2.0"
description = "A simple and easy to use TOML validator for Python."
authors = [
    { name = "Marcus Fredriksson", email = "marcus@marcusfredriksson.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
readme = "README.md"
keywords = ["toml", "validator", "validation", "python"]
dependencies = []

[project.optional-dependencies]
build = ["build", "twine"]
dev = [
    "black>=24.10.0",
    "pytest>=8.3.4",
    "isort>=5.13.2",
    "pylint>=3.3.2",
    "pre-commit>=4.0.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tomlval", "tomlval.*"]

[tool.black]
line-length = 80
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 80

[tool.pylint.master]
ignore = ["venv", "__pycache__", ".git", "tests"]
persistent = true

[tool.pylint.messages_control]
disable = []

[tool.pylint.format]
max-line-length = 80

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --verbosity=1"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/marcusfrdk/tomlval"
Repository = "https://github.com/marcusfrdk/tomlval"
Issues = "https://github.com/marcusfrdk/tomlval/issues"
